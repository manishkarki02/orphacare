name: Frontend CI

on:
    pull_request:
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-ci.yml"

    push:
        branches:
            - main
        paths:
            - "frontend/**"
            - ".github/workflows/frontend-ci.yml"

    workflow_call:
permissions:
    contents: read

jobs:
    validate:
        name: Frontend validation

        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout the code
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                version: 10.20.0
                run_install: false

            - name: Setup node
              uses: actions/setup-node@v6
              with:
                # TODO: Use `node-version`; `version` is not the setup-node input for selecting Node.
                version: 22.18.0
                cache: pnpm
                # TODO: Use `cache-dependency-path` and point it at `frontend/pnpm-lock.yaml`.
                cache_dependency_path: frontend/pnpm-lock.yml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run TypeCheck
              run: pnpm exec tsc --noEmit

            - name: Build
              run: pnpm build

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Validate production image
              uses: docker/build-push-action@v6
              with:
                context: ./frontend
                # TODO: Add `frontend/Dockerfile` or remove this Docker validation step.
                file: ./frontend/Dockerfile
                target: production
                push: false
                tags: orpha-care-frontend:ci
                cache-from: type=gha,scope=frontend
                cache-to: type=gha,mode=max,scope=frontend
