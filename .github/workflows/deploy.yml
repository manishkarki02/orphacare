name: Build and Deploy

on:
    push:
        branches:
            - main

concurrency:
    group: production
    cancel-in-progress: false

jobs:
    backend-ci:
        uses: ./.github/workflows/backend-ci.yml
    
    frontend-ci:
        uses: ./.github/workflows/frontend-ci.yml
    
    publish:
        name: Publish Docker Images

        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write
        
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup docker buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Backend Build and push
              uses: docker/build-push-action@v6
              with:
                context: ./backend
                file: ./backend/Dockerfile
                target: production
                push: true

                tags: |
                    ghcr.io/${{ github.repository_owner }}/orpha-care-backend:${{ github.sha }}
                    ghcr.io/${{ github.repository_owner }}/orpha-care-backend:latest
                
                cache-from: type=gha,scope=backend
                cache-to: type=gha,mode=max,scope=backend

            - name: Migration build and push
              uses: docker/build-push-action@v6
              with:
                context: ./backend
                file: ./backend/Docker
                target: production
                push: true

                tags: |
                    ghcr.io/${{ github.repository_owner }}/orpha-care-migration:${{ github.sha }}

                cache-from: type=gha,scope=migration
                cache-to: type=gha,mode=max,scope=migration
    
    deploy:
        name: Deploy Production

        needs:
            - publish

        runs-on:
            - self-hosted
            - ubuntu-latest
        
        permissions:
            contents: read
            packages: read
        
        environment:
            name: production
        
        steps:
            - name: Checkout
              uses: actions/checkout@v6
             
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}

            - name: Update production compose
              run: |
                cp docker-compose.prod.yml /opt/orpha-care/docker-compose.prod.yml

            
            